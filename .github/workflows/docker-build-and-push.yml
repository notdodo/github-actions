name: Docker Build and Push

on:
  workflow_call:
    inputs:
      disable-sudo:
        type: boolean
        default: true
      dockerfile:
        type: string
        default: 'Dockerfile'
      environment:
        type: string
        default: ''
      egress-policy-allowlist:
        type: string
        default: ''
      flavor:
        type: string
        description: 'Defines a global behavior for tags'
        default: |
          latest=auto
          prefix=
          suffix=
      image:
        required: true
        type: string
      platforms:
        type: string
        default: 'linux/amd64,linux/arm64'
      push:
        type: boolean
        default: false
      registry:
        type: string
        default: ''
      runs-on:
        type: string
        default: 'ubuntu-latest'
      scan-image:
        type: boolean
        default: true
      sign-image:
        type: boolean
        default: true
      tags:
        type: string
        default: |
          type=schedule
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
      trivy-severity:
        type: string
        default: 'CRITICAL,HIGH'
      trivy-vuln-type:
        type: string
        default: 'os,library'
      upload-sarif:
        type: boolean
        default: true
      working-directory:
        type: string
        default: '.'
    outputs:
      image_name:
        description: 'Full image name (<registry>/<image>).'
        value: ${{ jobs.build-and-push-image.outputs.image_name }}
      image_digest:
        description: 'Pushed image digest (sha256:...), empty when push=false.'
        value: ${{ jobs.build-and-push-image.outputs.image_digest }}
      image_ref:
        description: 'Immutable image reference (<registry>/<image>@<digest>), empty when push=false.'
        value: ${{ jobs.build-and-push-image.outputs.image_ref }}
      local_image_ref:
        description: 'Local image reference used when push=false.'
        value: ${{ jobs.build-and-push-image.outputs.local_image_ref }}
    secrets:
      registry-username:
        required: false
      registry-password:
        required: false

jobs:
  build-and-push-image:
    outputs:
      image_name: ${{ steps.workflow-outputs.outputs.image_name }}
      image_digest: ${{ steps.workflow-outputs.outputs.image_digest }}
      image_ref: ${{ steps.workflow-outputs.outputs.image_ref }}
      local_image_ref: ${{ steps.workflow-outputs.outputs.local_image_ref }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    name: Docker build and push
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment != '' && inputs.environment || null }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: ${{ inputs.disable-sudo }}
          egress-policy: block
          allowed-endpoints: >
            *.docker.com:443
            *.docker.io:443
            *.githubapp.com:443
            *.githubusercontent.com:443
            *.sigstore.dev:443
            *.trivy.dev:443
            api.github.com:443
            codeload.github.com:443
            docker-images-prod.*.r2.cloudflarestorage.com:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            release-assets.githubusercontent.com:443
            ${{ inputs.egress-policy-allowlist }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.push
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}
      - name: Extract metadata (tags, labels) for Docker
        id: metadata
        if: inputs.push
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.registry }}/${{ inputs.image }}
          tags: ${{ inputs.tags }}
          flavor: ${{ inputs.flavor }}
      - name: Build and push
        id: build
        if: inputs.push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ./${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/${{ inputs.dockerfile }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: ${{ inputs.platforms }}
          provenance: mode=max
          push: ${{ inputs.push }}
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Build push locally
        id: build-local
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ./${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          load: true
          push: false
          tags: localimage:${{ github.sha }}
      - name: Set workflow outputs
        id: workflow-outputs
        env:
          IMAGE_NAME: ${{ format('{0}/{1}', inputs.registry, inputs.image) }}
          IMAGE_DIGEST: ${{ inputs.push && steps.build.outputs.digest || '' }}
          IMAGE_REF: ${{ inputs.push && format('{0}/{1}@{2}', inputs.registry, inputs.image, steps.build.outputs.digest) || '' }}
          LOCAL_IMAGE_REF: ${{ !inputs.push && format('localimage:{0}', github.sha) || '' }}
        run: |
          {
            echo "image_name=${IMAGE_NAME}"
            echo "image_digest=${IMAGE_DIGEST}"
            echo "image_ref=${IMAGE_REF}"
            echo "local_image_ref=${LOCAL_IMAGE_REF}"
          } >> "${GITHUB_OUTPUT}"
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: inputs.scan-image
        with:
          format: sarif
          ignore-unfixed: true
          image-ref: ${{ inputs.push && format('{0}/{1}@{2}', inputs.registry, inputs.image, steps.build.outputs.digest) || format('localimage:{0}', github.sha) }}
          vuln-type: ${{ inputs.trivy-vuln-type }}
          severity: ${{ inputs.trivy-severity }}
          output: ${{ inputs.working-directory }}/trivy_results.sarif
          github-pat: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: inputs.push
        with:
          format: spdx-json
          image-ref: ${{ format('{0}/{1}@{2}', inputs.registry, inputs.image, steps.build.outputs.digest) }}
          output: ${{ inputs.working-directory }}/sbom.spdx.json
          github-pat: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate artifact and SBOM attestation
        if: inputs.push
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: ${{ startsWith(inputs.registry, 'ghcr.io') }}
          sbom-path: ${{ inputs.working-directory }}/sbom.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.push && inputs.sign-image
      - name: Sign image
        if: inputs.push && inputs.sign-image
        env:
          COSIGN_YES: 'true'
          IMAGE_REF: ${{ format('{0}/{1}@{2}', inputs.registry, inputs.image, steps.build.outputs.digest) }}
          CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign sign "${IMAGE_REF}"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/notdodo/github-actions/.github/workflows/docker-build-and-push.yml@refs/tags/docker-build-and-push-v[0-9]+$' \
            --certificate-oidc-issuer "${CERT_OIDC_ISSUER}" "${IMAGE_REF}"
      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        if: inputs.scan-image
      - name: Run reviewdog
        if: inputs.scan-image
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo -n "$(cat ./trivy_results.sarif)" | reviewdog -reporter=github-check -f=sarif -level=warning -diff="git diff FETCH_HEAD"
      - name: Upload results
        if: ${{ inputs.scan-image && inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 #  v4.37.6
        with:
          sarif_file: ${{ inputs.working-directory }}/trivy_results.sarif
          category: container-security
